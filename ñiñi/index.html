<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cielo Mágico con Luna y Música Local</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="instruccion">Haz clic en el cielo para escuchar tu música y descubrir los mensajes...</div>

    <!-- Luna Brillante -->
    <div class="luna"></div>

    <!-- Capas de estrellas de fondo -->
    <div class="estrellas-fondo-1"></div>
    <div class="estrellas-fondo-2"></div>
    <div class="estrellas-parpado"></div>

    <!-- AQUÍ ESTÁ CORREGIDO EL SIGNO IGUAL (=) -->
    <div id="universo"></div>

    <!-- Música de fondo local -->
    <audio id="musica-fondo" loop>
        <source src="musica.mp3" type="audio/mp3">
    </audio>
</body>
</html>
